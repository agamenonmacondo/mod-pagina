version: '3.8'

services:
  # Base de datos vectorial (Qdrant) - DEBE INICIARSE PRIMERO
  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./vector_db_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - ava-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Chat Service
  webhook-chat:
    build:
      context: .
      dockerfile: Dockerfile.webhook_chat
    ports:
      - "5001:5001"
    environment:
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
      - QDRANT_URL=http://vector-db:6333
    volumes:
      - ./ava_bot:/app/ava_bot
      - ./chat_uploads:/app/chat_uploads
      - ./chat_logs:/app/chat_logs
      - ./uploads:/app/uploads
      - ./user_images:/app/user_images
      - ./processed_images:/app/processed_images
    networks:
      - ava-network
    depends_on:
      vector-db:
        condition: service_healthy
    restart: unless-stopped

  # Backend News Service
  webhook-news:
    build:
      context: .
      dockerfile: Dockerfile.webhook_news
    ports:
      - "5000:5000"
    environment:
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
      - QDRANT_URL=http://vector-db:6333
    volumes:
      - ./ava_bot_news:/app/ava_bot_news
      - ./ava_bot:/app/ava_bot
    networks:
      - ava-network
    depends_on:
      vector-db:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  nextjs-app:
    build: 
      context: ./firebase_pagina
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_NEWS_API_URL=http://webhook-news:5000
      - NEXT_PUBLIC_CHAT_API_URL=http://webhook-chat:5001
    depends_on:
      - webhook-news
      - webhook-chat
    volumes:
      - ./firebase_pagina/public:/app/public
    networks:
      - ava-network

networks:
  ava-network:
    driver: bridge

volumes:
  vector_db_data:
