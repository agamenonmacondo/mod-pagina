steps:
  # Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'Dockerfile'  # Dockerfile está en la raíz
      - '-t' 
      - 'gcr.io/$PROJECT_ID/avacloud:$COMMIT_SHA'
      - '.'  # Contexto de build desde la raíz del proyecto
  
  # Hacer push de la imagen
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/avacloud:$COMMIT_SHA']
  
  # Desplegar a Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'avacloud'
    - '--image'
    - 'gcr.io/$PROJECT_ID/avacloud:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/avacloud:$COMMIT_SHA'